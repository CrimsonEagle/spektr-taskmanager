name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag name (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri application & installers
        run: pnpm tauri build

      - name: Collect release assets & compute SHA-256 checksums
        shell: pwsh
        run: |
          $tag = if ("${{ inputs.tag }}" -ne "") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Copy-Item -Destination release-assets/
          Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" | Copy-Item -Destination release-assets/
          Copy-Item -Path "src-tauri/target/release/spektr-taskmanager.exe" -Destination "release-assets/Spektr-Taskmanager_${tag}_x64-portable.exe"

          $hashes = Get-ChildItem -Path release-assets -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $hashes | Out-File -FilePath release-assets/SHA256SUMS.txt -Encoding utf8NoBOM

          Write-Output "Collected assets:"
          Get-ChildItem -Path release-assets | Format-Table Name, Length

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Spektr Taskmanager ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: release-assets/*
          body: |
            ### Downloads
            - **Windows Setup Installer (`.exe`)** — Recommended for most users
            - **Windows MSI Installer (`.msi`)** — Enterprise / Windows Installer package
            - **Standalone Portable (`.exe`)** — Single executable, no installation required
            - **`SHA256SUMS.txt`** — Checksums to verify file integrity

            > **Windows SmartScreen Notice:** Because these open-source binaries are not code-signed with a paid certificate, Windows Defender SmartScreen may display a warning on first run. All release binaries are built directly from this repository via GitHub Actions. Click **More info → Run anyway** to proceed, or verify the file hash against `SHA256SUMS.txt` (or build from source).
