name: Bug Report
description: Report a bug, crash, or telemetry discrepancy in Spektr Taskmanager
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue! Please include your environment details so we can reproduce hardware/Windows-specific behavior.

  - type: input
    id: version
    attributes:
      label: Spektr Taskmanager Version
      placeholder: e.g. v0.3.0
    validations:
      required: true

  - type: input
    id: windows_version
    attributes:
      label: Windows Version
      description: Run `winver` to see the exact build number.
      placeholder: e.g. Windows 11 24H2 (Build 26100)
    validations:
      required: true

  - type: dropdown
    id: admin_mode
    attributes:
      label: Running as Administrator?
      options:
        - No (Standard User)
        - Yes (Elevated / Administrator)
        - Happens in both modes
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: CPU & GPU Hardware (optional, helpful for telemetry bugs)
      placeholder: e.g. AMD Ryzen 7 7800X3D, NVIDIA RTX 4070
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open Spektr Taskmanager
        2. Navigate to '...'
        3. Click on '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Additional Context
      description: Drag and drop screenshots or add any extra notes here.
    validations:
      required: false
